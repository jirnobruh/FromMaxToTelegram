[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-to-tg-bot"
version = "0.1.0"
description = "Service for forwarding messages from MAX messenger to Telegram topics/channels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
